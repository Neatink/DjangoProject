<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/static/styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
<h2>Вхід</h2>
<form method="POST">
    {% csrf_token %}
    {{ form.username.label_tag }}
    {{ form.username }}<br>
    {{ form.password.label_tag }}
    {{ form.password }}<br>
    {{ form.email.label_tag }}
    {{ form.email }}<br>
    <button type="submit">Увійти</button>
    <a href="/password_reset">Забули пароль?</a><br>
    <a href="/register">Створити аккаунт</a>
</form>
<p style="color:red;">
{% for error in form.non_field_errors %}
    {{ error }}
{% endfor %}
</p>
</body>
</html>
